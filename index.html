<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" name="viewport" content="width=device-width,initial-scale:1,maximum-scale:1,user-scalable=no">
<title>INFINITE-BYTE</title>
<style>
*{
margin: 0;
padding: 0;
color: white;
}
body{
display: flex;
justify-content: center;
align-items: center;
}
.Byte{
margin-top: 100px;
width: 200px;
height: 100px;
background:gray;
font-family: monospace;
text-align: center;
display: flex;
justify-content: center;
align-items: center;
border: 1px solid #555;
border-radius: 30px;
opacity: 0;
transform: translateY(30px);
animation: slide 0.6s forwards;
}
@keyframes slide{
to{
opacity: 1;
transform: translateY(0);
}
}
</style>
</head>
<body>
<div class="Byte">
<p>INFINITE</p>
</div>
</body>
</html>
